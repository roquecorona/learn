<style>
/* Layout idea: a calm, paper-like study course. Home → chapter → lesson; reading happens in short screens; practice uses an instructions pane beside a workspace. Light theme only, by request (cream). */
:root{
  --bg:#f6f0e4; --paper:#fffcf5; --ink:#26221c; --muted:#6f675b; --line:#e2d8c6; --soft:#f0e9db;
  --accent:#1f5c57; --accent-soft:#e1ece7; --accent-ink:#164540; --mark:#f7e6b0;
  --ok:#2d7347; --ok-soft:#e4f0e3; --warn:#8c5a0c; --warn-soft:#faefd4; --bad:#a3322a; --bad-soft:#f7e3de;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --math:"STIX Two Text","Cambria Math",Georgia,serif;
  --shadow:0 1px 2px rgba(70,52,20,.06),0 4px 14px rgba(70,52,20,.06);
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;line-height:1.2;margin:0;letter-spacing:-.005em}
h1{font-size:40px}h2{font-size:28px}h3{font-size:20px}
p{margin:0 0 14px}
code,.mono{font-family:var(--mono);font-size:.88em}
a{color:var(--accent)}
button{font:inherit;font-size:15px;font-weight:500;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fffcf5}
button.primary:hover{background:var(--accent-ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{width:100%;resize:vertical}
input[type=range]{accent-color:var(--accent)}
.kicker{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted)}
.chip.done{background:var(--ok-soft);color:var(--ok)}.chip.active{background:var(--accent-soft);color:var(--accent-ink)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* app header */
header.app{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 22px;background:rgba(255,252,245,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600}
.brand .mk{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fffcf5;display:grid;place-items:center;font-family:var(--serif);font-size:15px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.crumbs .sep{opacity:.5}
header.app .sp{flex:1}
.save{font-size:13px;color:var(--muted)}

/* drawer (course menu) */
.scrim{position:fixed;inset:0;background:rgba(38,34,28,.28);z-index:40}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(380px,92vw);background:var(--paper);z-index:41;box-shadow:var(--shadow);padding:20px 18px;overflow:auto}
.drawer h3{font-size:18px;margin:0 0 12px}
.drawer{width:min(430px,94vw)}.drawer .ch{display:flex;align-items:center;gap:10px}.mcount{font-family:var(--sans);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.mls{margin:4px 0 14px 12px;display:flex;flex-direction:column;gap:4px;font-family:var(--sans)}
.ml{border:1px solid var(--line);border-radius:10px;background:var(--paper)}.ml.here{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.ml.done{background:#f3f6ee}
.ml summary{display:flex;align-items:center;gap:9px;padding:8px 10px;cursor:pointer;list-style:none;font-size:14px}.ml summary::-webkit-details-marker{display:none}
.mn{width:22px;height:22px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1.5px solid #d8ccb6;color:var(--muted);background:var(--paper)}.ml.done .mn{background:var(--ok);border-color:var(--ok);color:#fffcf5}.ml.part .mn,.ml.here .mn{border-color:var(--accent);color:var(--accent)}
.mt{flex:1;font-weight:600;line-height:1.3}.ml.done .mt{font-weight:500;color:#5a5347}.mbar{width:44px;height:5px;border-radius:3px;background:#e8dfcd;overflow:hidden;flex:none}.mbar i{display:block;height:100%;background:var(--ok)}
.ml a{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;font-size:14px;color:var(--ink);text-decoration:none;border-top:1px solid #efe7d6}.ml a:hover{background:var(--soft)}.ml a.cur{background:var(--accent-soft);font-weight:600}.ml a.dn{color:#5a5347}
.mk{width:14px;color:var(--ok);font-weight:700;flex:none}.mtag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;flex:none;width:38px;text-align:center}.mtag.read{background:#ece4d4;color:#5a5347}.mtag.practice{background:var(--accent-soft);color:var(--accent-ink)}.mtag.lab{background:#fbf3dc;color:#7a5410}
.tree .ch{padding:8px 6px;border-radius:10px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.tree .ch:hover{background:var(--soft)}
.tree .ls{margin:2px 0 8px 36px;font-size:14.5px}
.tree .ls a{display:block;padding:4px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.tree .ls a:hover{background:var(--soft)}
.tree .off{color:var(--muted);font-weight:400}
.num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--soft);color:var(--muted)}
.num.done{background:var(--ok);color:#fffcf5}.num.active{background:var(--accent);color:#fffcf5}

/* pages */
.page{max-width:1080px;margin:0 auto;padding:40px 28px 80px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:end;margin-bottom:36px}
.hero p{font-size:18px;color:var(--muted);max-width:56ch;margin-top:10px}
.cont{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.cont h3{font-size:21px;margin:6px 0 4px}
.cont .where{color:var(--muted);font-size:14.5px;margin-bottom:14px}
.stats{display:flex;gap:28px;margin:18px 0 0;font-size:14px;color:var(--muted)}
.stats b{display:block;font-family:var(--serif);font-size:26px;color:var(--ink);font-weight:600}
.chlist{display:grid;gap:10px}
.chrow{display:grid;grid-template-columns:44px minmax(0,1fr) 170px 120px;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;text-decoration:none;color:var(--ink)}
a.chrow:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.chrow .cn{font-family:var(--serif);font-size:24px;color:var(--muted);text-align:center}
.chrow .ct{font-family:var(--serif);font-size:19px;font-weight:600}
.chrow .cs{font-size:14px;color:var(--muted)}
.chrow.off{opacity:.62}
.sectionh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 14px}
.sectionh h2{font-size:24px}

/* chapter page */
.chhead{margin-bottom:28px}.chhead p{font-size:18px;color:var(--muted);max-width:62ch;margin-top:10px}
.lessons{display:grid;gap:12px}
.lesson{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px}
.lesson.off{background:transparent}
.lesson h3{font-size:19px}
.lesson .d{color:var(--muted);font-size:15px;margin:4px 0 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14.5px;background:var(--bg)}
.act:hover{border-color:var(--accent)}
.act .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.act.done .dot{background:var(--ok)}.act.active .dot{background:var(--accent)}

/* lesson player */
.lstrip{background:var(--paper);border-bottom:1px solid var(--line)}
.lstrip .in{max-width:1400px;margin:0 auto;padding:12px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lstrip .lt{font-family:var(--serif);font-size:18px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--muted);font-size:14.5px;padding:6px 12px;border-radius:999px;border:1px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent-ink);background:var(--accent-soft);font-weight:500}
.tabs .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--soft)}
.tabs a.done .n{background:var(--ok);color:#fffcf5}
.tabs a.on .n{background:var(--accent);color:#fffcf5}

/* reading screens */
.reader{max-width:760px;margin:0 auto;padding:36px 24px 120px}
.screen h2{font-size:32px;margin:8px 0 16px}
.screen .body{font-family:var(--serif);font-size:19.5px;line-height:1.65}
.screen .body p{margin-bottom:16px}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:18px 0;box-shadow:var(--shadow)}
.figcap{font-size:14.5px;color:var(--muted);margin-top:10px;font-family:var(--sans)}
.formula{font-family:var(--math);font-size:30px;text-align:center;margin:10px 0}
.formula .b{color:var(--accent)}
.try{border-left:4px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:0 12px 12px 0;margin:18px 0;font-family:var(--sans)}
.try .lab{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px}
.try .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.fb{margin-top:10px;border-radius:10px;padding:10px 14px;font-size:15.5px;font-family:var(--sans)}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--warn-soft);color:var(--warn)}.fb.bad{background:var(--bad-soft);color:var(--bad)}.fb.info{background:var(--soft);color:var(--ink)}
table.t{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:16px;font-family:var(--sans);margin:0 auto}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 18px;text-align:right}
table.t th{font-weight:600;color:var(--muted);font-size:13.5px}
.slider{display:grid;grid-template-columns:96px 1fr 56px;gap:12px;align-items:center;margin:6px 0;font-family:var(--sans)}
.slider output{font-family:var(--mono);font-size:14px;text-align:right}
.score{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-top:6px;font-family:var(--sans)}

def fit_poly(xs, ys, degree, lam=0.0):
    # Finds the weights and bias with the smallest squared error
    # (plus lam * sum of squared weights). Same goal as running
    # square_trick for a very long time, solved directly.
    n = len(xs)
    rows = [poly_features(x, degree) + [1.0] for x in xs]
    cols = degree + 1
    A = [r[:] for r in rows]
    b = list(ys)
    if lam > 0:
        for j in range(degree):
            extra = [0.0] * cols
            extra[j] = math.sqrt(lam)
            A.append(extra)
            b.append(0.0)
    m = len(A)
    # Householder QR least squares (numerically stable)
    R = [r[:] for r in A]
    y = b[:]
    for k in range(cols):
        norm = math.sqrt(sum(R[i][k] ** 2 for i in range(k, m)))
        if norm == 0:
            continue
        alpha = -norm if R[k][k] > 0 else norm
        v = [0.0] * m
        v[k] = R[k][k] - alpha
        for i in range(k + 1, m):
            v[i] = R[i][k]
        vnorm2 = sum(v[i] ** 2 for i in range(k, m))
        if vnorm2 == 0:
            continue
        for j in range(k, cols):
            s = sum(v[i] * R[i][j] for i in range(k, m))
            f = 2 * s / vnorm2
            for i in range(k, m):
                R[i][j] -= f * v[i]
        s = sum(v[i] * y[i] for i in range(k, m))
        f = 2 * s / vnorm2
        for i in range(k, m):
            y[i] -= f * v[i]
    coef = [0.0] * cols
    for k in range(cols - 1, -1, -1):
        s = y[k] - sum(R[k][j] * coef[j] for j in range(k + 1, cols))
        coef[k] = s / R[k][k] if R[k][k] != 0 else 0.0
    weights = coef[:degree]
    bias = coef[degree]
    return weights, bias

def fit_poly_lasso(xs, ys, degree, lam, sweeps=4000):
    # Finds weights and bias with the smallest
    # (mean squared error / 2) + lam * (L1 norm of the weights).
    n = len(xs)
    X = [poly_features(x, degree) for x in xs]
    w = [0.0] * degree
    b = sum(ys) / n
    r = [ys[i] - b for i in range(n)]
    col_sq = [sum(X[i][j] ** 2 for i in range(n)) / n for j in range(degree)]
    for _ in range(sweeps):
        biggest = 0.0
        for j in range(degree):
            rho = sum(X[i][j] * (r[i] + w[j] * X[i][j]) for i in range(n)) / n
            if rho > lam:
                new = (rho - lam) / col_sq[j]
            elif rho < -lam:
                new = (rho + lam) / col_sq[j]
            else:
                new = 0.0
            delta = new - w[j]
            if delta != 0.0:
                for i in range(n):
                    r[i] -= delta * X[i][j]
                w[j] = new
                biggest = max(biggest, abs(delta))
        shift = sum(r) / n
        b += shift
        r = [ri - shift for ri in r]
        if biggest < 1e-10:
            break
    return w, b

    total = 0

def poly_square_trick(weights, bias, x, label, eta):
    features = poly_features(x, len(weights))
    prediction = poly_predict(weights, bias, x)
    miss = label - prediction
    new_weights = []
    for j in range(len(weights)):
        new_weights.append(weights[j] + eta * features[j] * miss)
    bias = bias + eta * miss
    return new_weights, bias

def perceptron_trick(weights, bias, features, label, eta):
    pred = prediction(weights, bias, features)
    new_weights = []
    for j in range(len(weights)):
        new_weights.append(weights[j] + eta * (label - pred) * features[j])
    bias = bias + eta * (label - pred)
    return new_weights, bias

def ridge_score(weights, bias, xs, ys, lam):

def ridge_trick(weights, bias, x, label, eta, lam):
    features = poly_features(x, len(weights))
    miss = label - poly_predict(weights, bias, x)
    new_weights = []
    for j in range(len(weights)):
        new_weights.append(weights[j] + eta * features[j] * miss - eta * lam * weights[j])
    bias = bias + eta * miss
    return new_weights, bias

import random
import math

# ---- Your Chapter 3 toolkit (from Lesson 0) ----
def square_trick(m, b, r, p, eta):
    prediction = b + m * r
    miss = p - prediction
    m = m + eta * r * miss
    b = b + eta * miss
    return m, b

def train(features, labels, eta, epochs):
    m = 0
    b = 0
    for epoch in range(epochs):
        i = random.randint(0, len(features) - 1)
        m, b = square_trick(m, b, features[i], labels[i], eta)
    return m, b

def rmse(m, b, features, labels):
    total = 0
    for i in range(len(features)):
        prediction = b + m * features[i]
        miss = labels[i] - prediction
        total += miss ** 2
    return math.sqrt(total / len(features))</script>

def train_val_errors(x_train, y_train, x_val, y_val, max_degree):
    train_errors = []
    val_errors = []

const L2PST='def poly_square_trick(weights, bias, x, label, eta):\n    # 1 · features and current prediction\n    features = poly_features(x, len(weights))\n    prediction = poly_predict(weights, bias, x)\n    # 2 · how far off is it?\n    miss = label - prediction\n    # 3 · nudge each weight: new = old + eta · feature · miss\n    new_weights = []\n    for j in range(len(weights)):\n        new_weights.append(weights[j] + eta * features[j] * miss)\n    # 4 · nudge the bias: new = old + eta · miss\n    bias = bias + eta * miss\n    # 5 · hand back the updated model\n    return new_weights, bias';
const PST_ANAT=[
 {n:'1',code:'features = poly_features(x, len(weights))',does:'Builds the list [x, x², …], one number per weight. For x = 0.5 and two weights: [0.5, 0.25].',means:'The <b>features</b>: the inputs the model multiplies by its weights.',was:'r  # the one feature: number of rooms'},
 {n:'1',code:'prediction = poly_predict(weights, bias, x)',does:'Runs your Lesson 1 function with the <i>current</i> weights and bias. From all zeros it returns 0.',means:'The model\'s <b>prediction</b> ŷ for this point, before learning from it.',was:'prediction = b + m * r'},
 {n:'2',code:'miss = label - prediction',does:'Subtracts: true value minus guess. 1.84 − 0 = 1.84.',means:'The <b>error</b> on this point. Positive: the guess was too low, so the knobs should go up. Negative: too high, so they should go down.',was:'miss = p - prediction'},
 {n:'3',code:'new_weights = []\nfor j in range(len(weights)):',does:'Starts an empty list, then visits each weight by its position j (0, then 1).',means:'Every weight gets its own update.'},
 {n:'3',code:'    new_weights.append(weights[j] + eta * features[j] * miss)',does:'Adds one number to the list: the <b>old weight plus its nudge</b>. For j = 0: 0 + 0.1 × 0.5 × 1.84 = 0.092.',means:'The <b>update rule</b>. The nudge is η (step size) × feature (this weight\'s share of the prediction) × miss (direction and size of the error).',was:'m = m + eta * r * miss'},
 {n:'4',code:'bias = bias + eta * miss',does:'Replaces the bias with old bias plus eta × miss: 0 + 0.1 × 1.84 = 0.184.',means:'The bias always contributes fully (its "feature" is 1), so its nudge has no feature factor.',was:'b = b + eta * miss'},
 {n:'5',code:'return new_weights, bias',does:'Hands back two values: the <b>new</b> list and the new bias.',means:'The updated model. Returning <code>weights</code> instead would hand back the old, unchanged list.',was:'return m, b'}];
const LAB2_ANAT=[
 {code:'random.seed(0)',does:'Fixes Python\'s random choices so they repeat on every run.',means:'Makes your numbers match the expected ones. Not part of the model.'},
 {code:'weights, bias = [0, 0], 0',does:'Two variables at once: weights is the list [0, 0], bias is 0.',means:'The <b>starting guess</b>: a flat model ŷ = 0. Two weights because this is a degree-2 model.'},
 {code:'for step in range(5000):',does:'Repeats the indented lines 5,000 times.',means:'5,000 <b>training steps</b>.'},
 {code:'    i = random.randint(0, len(HILL_X) - 1)',does:'Picks a random position from 0 to 39.',means:'Train on one random point per step, like Chapter 3\'s train().'},
 {code:'    weights, bias = poly_square_trick(…)',does:'Calls your function and stores both returned values back into weights and bias. <b>You write this line (step 1).</b>',means:'One training step. Storing the result is what makes the next step start from the improved model.'},
 {code:'weights, bias = fit_poly(HILL_X, HILL_Y, degree)',does:'Returns the weights and bias with the smallest squared error for this degree.',means:'Where training is heading, computed directly in one call, so you can compare degrees instantly.'},
 {code:'error = poly_rmse(weights, bias, HILL_X, HILL_Y)',does:'Predicts every point, squares each miss, averages, takes the square root. <b>You write this line (step 2).</b>',means:'The <b>training error</b>: the typical size of a miss on the points the model was fit to.'}];
function knobPlot(el,w,b,extra){const c=DATA.grid.map(x=>[x,b+w[0]*x+(w[1]||0)*x*x]);plot(el,{x:hillAxes.x,y:{min:0,max:2.6,ticks:[0,1,2]},aria:'Hill data and the model curve',series:[{type:'points',data:pts(DATA.X,DATA.Y),color:'ink',opacity:.45},{type:'line',data:c,color:'accent'},...(extra||[])]})}
const l2rmse=(w,b)=>Math.sqrt(DATA.X.reduce((s,x,i)=>s+(DATA.Y[i]-(b+w[0]*x+w[1]*x*x))**2,0)/DATA.X.length);

  html:()=>`<div class="formula">new wⱼ = wⱼ + η · featureⱼ · miss</div><p>Read it as: <b>the new weight is the old weight plus a nudge</b>. The nudge has three factors, and each one has a job:</p>
<div class="cards"><div class="card"><h4 style="font-family:var(--sans)">miss: which way, how far</h4><p style="margin:0">Positive (guess too low) pushes weights up; negative pushes them down; zero leaves them alone. A bigger miss gives a bigger nudge.</p></div><div class="card"><h4 style="font-family:var(--sans)">featureⱼ: how much blame</h4><p style="margin:0">A weight whose feature was 0 had no effect on this prediction, so it doesn't move. A bigger feature means that weight moved the prediction more, so it moves more.</p></div><div class="card"><h4 style="font-family:var(--sans)">η: step size</h4><p style="margin:0">The <b>learning rate</b>. Small, so one point can't yank the model; many small steps add up. You choose it, so it is a hyperparameter (Chapter 3).</p></div></div>
<div class="fig" style="margin-top:16px"><div class="slider"><label for="nm">miss</label><input type="range" id="nm" min="-2" max="2" step="0.1" value="1.8"><output id="nmo"></output></div><div class="slider"><label for="nf">feature</label><input type="range" id="nf" min="0" max="1" step="0.05" value="0.5"><output id="nfo"></output></div><div class="slider"><label for="ne">η</label><input type="range" id="ne" min="0" max="2" step="1" value="1"><output id="neo"></output></div><div id="nviz"></div></div>
${tryBox('l2n','The model predicts 2.2 at a point whose label is 1.84. Which way do the weights with positive features move?',mcHTML('l2n',['up','down','they stay the same']))}
<p class="figcap">The book connects this rule to gradient descent in Chapter 3.</p>`,
  init(S){const etas=[0.01,0.1,0.5];const draw=()=>{const m=+$('#nm').value,f=+$('#nf').value,e=etas[+$('#ne').value];$('#nmo').textContent=m.toFixed(1);$('#nfo').textContent=f.toFixed(2);$('#neo').textContent=e;const n=e*f*m;
    const dir=Math.abs(n)<1e-12?'stays the same':n>0?'goes up':'goes down';const W=560,H=120,c=W/2,sc=200;const x1=c+Math.max(-260,Math.min(260,n*sc));
    $('#nviz').innerHTML=`<div class="formula" style="font-size:22px;margin:10px 0">nudge = ${e} · ${f.toFixed(2)} · ${m.toFixed(1)} = <b>${n.toFixed(3)}</b></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="nudge arrow"><line x1="20" x2="${W-20}" y1="60" y2="60" stroke="${C.soft}" stroke-width="2"/><line x1="${c}" x2="${c}" y1="40" y2="80" stroke="${C.muted}" stroke-width="2"/><text x="${c}" y="100" text-anchor="middle" font-size="13" fill="#6f675b" font-family="Instrument Sans,sans-serif">old weight</text>${Math.abs(n)>1e-12?`<line x1="${c}" x2="${x1}" y1="60" y2="60" stroke="${C.accent}" stroke-width="5"/><polygon points="${x1},50 ${x1+(n>0?14:-14)},60 ${x1},70" fill="${C.accent}"/>`:''}<text x="${c}" y="28" text-anchor="middle" font-size="15" fill="#26221c" font-family="Instrument Sans,sans-serif">the weight ${dir}</text></svg>`};
   ['#nm','#nf','#ne'].forEach(s=>$(s).oninput=draw);draw();
   wireMC(S,'l2n',1,'miss = 1.84 − 2.2 = −0.36. A negative miss makes every nudge negative, so those weights (and the bias) go down, lowering the prediction toward 1.84.','Compute the miss first: 1.84 − 2.2 = −0.36. A negative miss makes each nudge negative.')}},
 {k:'From rule to code',h:'The training step, line by line',
  html:()=>`<p>Here is the whole training step as Python. Each line does one move, and each matches a line of your Chapter 3 square_trick.</p>${anat(PST_ANAT)}
<div class="cards" style="margin-top:16px"><div class="card"><h4 style="font-family:var(--sans)">Pitfall: appending only the nudge</h4><p style="margin:0"><code>new_weights.append(eta * features[j] * miss)</code> drops the old weight, so every step forgets what training learned before.</p></div><div class="card"><h4 style="font-family:var(--sans)">Pitfall: returning the old list</h4><p style="margin:0"><code>return weights, bias</code> hands back the unchanged weights, so training never moves them. Return <code>new_weights</code>.</p></div></div>
${tryBox('l2p','weights = [1, −1], and the nudges for this step are 0.6 and 1.2. What should new_weights be?',mcHTML('l2p',['[0.6, 1.2]','[1.6, 0.2]','[1, −1]']))}`,

 {k:'Training',h:'Training = the step, repeated',
  html:()=>`<p>One step barely moves the curve. <b>Training</b> repeats the step thousands of times, each time on a randomly chosen point, always starting from the latest knobs. This is the loop you will run in the lab:</p>

<p class="small" style="margin-top:6px">Line 5 calls the step and stores what it returns back into weights and bias, so step 2 starts where step 1 ended.</p>
<h3 style="font-family:var(--sans);font-size:16px;margin:18px 0 6px">How poly_square_trick connects</h3>${flowHTML(FLOWS['ch4-l2-pst'])}

${tryBox('l2t','Why does line 5 say <code>weights, bias = poly_square_trick(…)</code> instead of just calling poly_square_trick(…)?',mcHTML('l2t',['To store the updated values, so the next step starts from them','To print the weights','Python requires an = on every function call']))}`,

const SUP={1:'',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹',10:'¹⁰'};const SUB=['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'];
const wsub=k=>'w'+String(k).split('').map(c=>SUB[+c]).join('');
function eqDeg(d){let t='ŷ = b';for(let k=1;k<=d;k++)t+=` + ${wsub(k)}x${SUP[k]}`;return t}
function predAt(f,x){let y=f.b;f.w.forEach((w,k)=>{y+=w*x**(k+1)});return y}

 {k:'Connecting back',h:'Training, with a pull toward zero',
  html:()=>`${connectBox('Lesson 2 · your question, part two',`<p style="margin:0 0 8px">You asked how the weights are determined: training nudges them with <code>eta · feature · miss</code>. Regularization adds one more term to that same step.</p>${twoCode('ridge step (L2)','new_w = w + eta * feature * miss\n        - eta * lam * w','lasso step (L1)','new_w = w + eta * feature * miss\n        - eta * lam * sign(w)')}`)}
<p><code>sign(w)</code> is +1 when the weight is positive and −1 when it is negative, so the lasso term always pulls toward 0 by the same amount. If a lasso step would carry a weight past 0, it stops at exactly 0.</p><p>Take a step where the nudge is 0, with eta = 0.1 and λ = 1. Ridge takes away 10% of the weight. Lasso takes away a fixed 0.1, and stops at 0.</p>
<div class="fig"><table class="t"><tr><th>weight before</th><th>ridge after</th><th>lasso after</th></tr><tr><td>0.5</td><td>0.45</td><td>0.4</td></tr><tr><td>0.05</td><td>0.045</td><td><b>0</b></td></tr></table></div>
${tryBox('l8a','A ridge step with nudge 0, eta = 0.1, λ = 1, on a weight of 2. New weight?',numHTML('l8a'))}`,
  init(S){wireNum(S,'l8a',1.8,1e-9,'2 − 0.1 × 1 × 2 = 1.8.')}},
 {k:'Side by side',h:'Ridge shrinks; lasso zeroes',
  html:()=>`<p>The same degree-10 model on the Lesson 4 training set, trained with ridge and with lasso. Move λ and watch the weights.</p>
<div class="fig"><div class="slider"><label for="l8l">λ</label><input type="range" id="l8l" min="0" max="${DATA.lasso.length-1}" step="1" value="0"><output id="l8lo"></output></div><div class="twocol"><div><b>Ridge</b><div id="l8r"></div></div><div><b>Lasso</b> · <span id="l8z"></span><div id="l8a2"></div></div></div><div class="figcap">Bars are w₁…w₁₀. Ridge's λ and lasso's λ are on slightly different scales (ridge sums the squared misses; lasso averages them), so compare shapes, not exact λ.</div></div>
${tryBox('l8b','Slide λ from small to large. What happens?',mcHTML('l8b',['Ridge weights shrink but stay non-zero; lasso weights drop to exactly 0','Both sets of weights drop to exactly 0','Neither set changes']))}`,
  init(S){const draw=()=>{const k=+$('#l8l').value,la=DATA.lasso[k],ri=DATA.ridge[k+1];$('#l8lo').textContent=la.lam;$('#l8z').textContent=la.zeros+' of 10 at exactly 0';
    const spec=w=>({w:320,h:200,padL:30,x:{min:0.3,max:10.7,ticks:w.map((_,i)=>[i+1,''+(i+1)])},y:{min:-1.2,max:1.2,ticks:[-1,0,1],base:0},aria:'weights',series:[{type:'bars',data:w.map((v,i)=>[i+1,Math.max(-1.2,Math.min(1.2,v))]),color:'accent'}]});

 {k:'Why',h:'The V and the bowl',
  html:()=>`${connectBox('Chapter 3 · the error valley',`<p style="margin:0">Absolute error made a V-shaped valley with steep, constant sides; square error made a smooth bowl that flattens at the bottom.</p>`)}
<div class="fig"><div id="l8v"></div><div class="figcap">Penalty against the value of one weight. |w| (L1, accent) keeps the same slope right up to 0. w² (L2, gold) gets flat near 0.</div></div>
<p>Near 0, the L2 bowl is flat, so its pull fades and the weight just gets small. The L1 V keeps the same slope all the way down, so its pull stays strong, and a small weight goes all the way to 0.</p>
${tryBox('l8c','Which penalty can make a weight exactly 0?',mcHTML('l8c',['L1 (lasso)','L2 (ridge)']))}`,
  init(S){const g=[];for(let i=0;i<=60;i++){const w=-1.5+3*i/60;g.push(w)}plot($('#l8v'),{x:{min:-1.5,max:1.5,ticks:[-1,0,1]},y:{min:0,max:2.3,ticks:[0,1,2]},legend:true,aria:'L1 and L2 penalty shapes',series:[{type:'line',data:g.map(w=>[w,Math.abs(w)]),color:'accent',label:'L1: |w|'},{type:'line',data:g.map(w=>[w,w*w]),color:'gold',label:'L2: w²'}]});
   wireMC(S,'l8c',0,'Lasso\'s constant pull reaches 0 and stays there. That is why lasso also selects features.')}},
 {k:'The words',h:'Which to use',
  html:()=>`<dl class="vocab"><dt>ridge (L2)</dt><dd>Shrinks every weight by a fraction. Keeps all features, all small.</dd><dt>lasso (L1)</dt><dd>Pulls by a fixed amount. Sets some weights to exactly 0, which drops those features.</dd><dt>feature selection</dt><dd>Keeping only the features that matter. Lasso does it automatically.</dd></dl>
<p>Use lasso when you suspect many features don't matter; use ridge when most features matter a little. Validation decides λ either way.</p>
<p class="figcap">Book: chapter 4, "Effects of L1 and L2 regularization in the coefficients of the model" and "An intuitive way to see regularization".</p>`,init(S){}}];

/* ================= HOW IT CONNECTS: simple top-to-bottom flows ================= */
function flowSteps(steps){return steps.map((s,i)=>`${i?'<div class="farr" aria-hidden="true">↓</div>':''}${s.repeat?`<div class="fgrp"><div class="fgl">↻ ${esc(s.repeat)}</div>${flowSteps(s.steps)}</div>`:`<div class="fs${s.here?' here':''}${s.you?' you':''}${s.help?' help':''}"><div class="fst"><code>${esc(s.t)}</code>${s.here?'<span class="fchip">this practice</span>':s.you?'<span class="fchip">you write this</span>':s.help?'<span class="fchip">given helper</span>':''}</div>${s.d?`<div class="fsd">${s.d}</div>`:''}</div>`}`).join('')}
function flowHTML(F){return F.parts?F.parts.map(p=>`<div class="fpart"><div class="fpn">${esc(p.name)}</div><div class="flow">${flowSteps(p.steps)}</div></div>`).join(''):`<div class="flow">${flowSteps(F.steps)}</div>`}

  html:()=>`<p>The hill data was made from a simple <b>pattern</b>, y = 2 − x², and then each point was pushed up or down a little at random. That random push is <b>noise</b>: measurement error, luck, everything the feature x cannot explain.</p>
<div class="formula">label = pattern + noise</div><div class="fig"><div id="c5pn"></div><div class="figcap">The dots are the 40 hill points. The smooth curve is the pattern they came from. The wiggly curve is the degree-10 model fit to these same points.</div></div>
<p>A model has one job: learn the pattern. The degree-10 curve bends to pass close to individual dots, so it has also learned their noise. New points will follow the same pattern but carry <b>different</b> noise, so everything it learned about this noise is wasted, and worse, wrong.</p>
${tryBox('c5pn','You collect 40 new hill points. Which part repeats?',mcHTML('c5pn',['the pattern only','the noise only','both']))}`,

 beforeWork('l5',{k:'The concept',h:'Why the two curves pull apart',
  html:()=>`<p>Put the two errors on one graph, with model complexity (here, the degree) along the bottom. This shape appears for almost every kind of model.</p><div class="fig"><div id="c5sh"></div><div class="figcap">A typical model complexity graph (illustrative numbers). The validation curve is cut off at 1.0.</div></div>
${wt(['region','what the model is doing','training error','validation error'],[['underfit','too simple to follow the pattern','high','high, about the same'],['good fit','follows the pattern, ignores most noise','low','lowest'],['overfit','follows the pattern <i>and</i> the training noise','keeps falling','rises: that noise is not in the validation points']])}
<p><b>Training error can only fall</b>, because a more flexible model can copy whatever a simpler one does and then use its extra freedom to get closer to the training points. <b>Validation error turns back up</b>, because past the sweet spot that extra freedom is spent on noise.</p>

 beforeWork('l6',{k:'The concept',h:'Why an overfit model needs huge weights',
  html:()=>`<p>A prediction is a sum of terms, one per feature: weight × feature. Here is the prediction at x = 0.8 for two models fit to the hill data.</p>
${wt(['model','its terms at x = 0.8','prediction'],[['degree 2',`${(w2[0]*X0).toFixed(2)} and ${(w2[1]*X0*X0).toFixed(2)}, plus the bias ${DATA.fits[2].b.toFixed(2)}`,p2.toFixed(2)],['degree 10','ten terms, shown below, plus the bias '+DATA.fits[10].b.toFixed(2),sum10.toFixed(2)]])}
<div class="fig"><div id="c6t"></div><div class="figcap">The ten terms of the degree-10 model at x = 0.8. Large positive and large negative terms almost cancel.</div></div>
<p>Both models predict about the same height. But the degree-10 model gets there by adding and subtracting large numbers that nearly cancel. Move x slightly and the terms no longer cancel the same way, so the prediction swings. <b>That swinging is the wiggle</b>, and it is only possible with large weights. Small weights can only make gentle curves.</p>
${tryBox('c6t','x moves from 0.80 to 0.95. Which model\'s prediction changes more?',mcHTML('c6t',['degree 2','degree 10','the same']))}`,

  {k:'The concept',h:'What a norm counts, and what it ignores',
  html:()=>`<p>To compare models we want <b>one number</b> for "how big are the weights". A norm is that number.</p>

${wt(['weights','L1: sum of sizes','L2: sum of squares'],[['[1, −1, 1, −1]','4','4'],['[4, 0, 0, 0]','4','16'],['[0.5, 0.5, 0.5, 0.5]','2','1']],'The first two lists have the same L1, but L2 is four times larger for the one that puts everything into a single big weight.')}
${tryBox('c6n','Which list of weights has the smallest L2 norm?',mcHTML('c6n',['[1, −1, 1, −1]','[4, 0, 0, 0]','[0.5, 0.5, 0.5, 0.5]']))}`,

{ /* Lesson 7 */
 beforeWork('l7',{k:'The concept',h:'Two goals that pull against each other',
  html:()=>`<p>Training has always had one goal: make the error small. Regularization adds a second goal: keep the model simple. The two conflict, because the lowest possible error needs big, noise-chasing weights.</p>
${wt(['goal','measured by','pushed to the extreme'],[['fit the training data','the error','overfitting'],['stay simple','the norm of the weights','all weights 0: a flat line, underfitting']])}
<p>The score adds the two together, and <b>λ is the exchange rate</b>: how much error you are willing to accept to remove one unit of complexity.</p>
<div class="fig"><div style="font-family:var(--sans)"><label style="display:flex;gap:10px;align-items:center"><span>λ</span><input type="range" id="c7l" min="0" max="0.006" step="0.0002" value="0" style="flex:1"><b id="c7lv" style="width:60px;text-align:right"></b></label><div id="c7b" style="margin-top:12px;display:grid;gap:12px"></div></div><div class="figcap">Model A: error 0.07, complexity 40 (wiggly). Model B: error 0.13, complexity 1 (smooth). Dark part: the error. Gold part: λ × complexity. The shorter bar wins.</div></div>
<p><b>The score is not only a grade given afterwards. It is what training minimizes.</b> Training compares not two candidates but every possible set of weights, and hands you the one with the lowest score. Change λ and a different set of weights wins, so you get a different curve. That is how λ changes the model's shape.</p>
${tryBox('c7c','Slide λ up from 0. What happens to the winner?',mcHTML('c7c',['A wins at every λ','A wins at first, then B takes over','B wins at every λ']))}`,
  init(S){const draw=()=>{const l=+$('#c7l').value;$('#c7lv').textContent=l.toFixed(4);const M=[['A · wiggly',0.07,40],['B · smooth',0.13,1]].map(m=>({n:m[0],e:m[1],p:l*m[2],s:m[1]+l*m[2]})),win=M[0].s<=M[1].s?0:1;$('#c7b').innerHTML=M.map((m,i)=>`<div><div style="display:flex;justify-content:space-between;font-size:14.5px"><span><b>${m.n}</b>${i===win?' · <span style="color:var(--ok);font-weight:600">lower score</span>':''}</span><span>${m.e.toFixed(2)} + ${m.p.toFixed(4)} = <b>${m.s.toFixed(4)}</b></span></div><div style="display:flex;height:16px;margin-top:4px;background:var(--soft);border-radius:4px;overflow:hidden"><span style="width:${m.e/0.35*100}%;background:var(--accent)"></span><span style="width:${m.p/0.35*100}%;background:#c08a1e"></span></div></div>`).join('')};$('#c7l').oninput=draw;draw();wireMC(S,'c7c',1,'At λ = 0 only the error counts, so A wins. As λ grows, A pays for its 40 units of complexity and B takes over (near λ = 0.0015).')}},
  {k:'The concept',h:'Why not just use a lower degree?',
  html:()=>`<p>In Lesson 4 you controlled overfitting by choosing the degree. Regularization is a second control, and usually the more useful one.</p>
${wt(['','choose a lower degree','regularize with λ'],[['what it changes','removes features completely','keeps every feature but shrinks the weights'],['how fine the control is','whole steps: 1, 2, 3, …','a smooth dial: any value of λ'],['when the features are not powers of x','there is no "degree" to lower','works on any model with weights'],['who decides','validation','validation']])}
<p>Real datasets have hundreds of unrelated features, such as the words in an email. There is no ordering like x, x², x³ to cut off, so the dial that still works is λ.</p>
${real('This is why regularization, and not hand-picking features, is the standard way to control overfitting in large models, including neural networks.')}
${tryBox('c7d','A spam filter has one feature per word, 5,000 words. Which control applies directly?',mcHTML('c7d',['lower the degree','regularize with λ']))}`,
  init(S){wireMC(S,'c7d',1,'There is no degree here. A penalty on the size of the 5,000 weights works for any model with weights.')}},
  tfScr('c7tf','Three statements about λ','Judge each one.',['A larger λ always gives a better model.','With λ = 0, the regularized score is just the error.','λ is found by training, the same way the weights are.'],[1,0,1],'Too large a λ flattens the model into underfitting. At λ = 0 the penalty term vanishes. λ is a hyperparameter: it is set before training and chosen with the validation set.'));}
{const i7=SCREENS.l7.findIndex(x=>x.h==='Two goals that pull against each other');if(i7>1)SCREENS.l7.splice(1,0,SCREENS.l7.splice(i7,1)[0])}
{ /* Lesson 8 */
 beforeWork('l8',{k:'The concept',h:'Every step is a tug of war',
  html:()=>`<p>In a regularized training step, each weight feels two pulls at once.</p>
${wt(['pull','comes from','direction'],[['the data pull','η · feature · miss','whichever way reduces this point\'s miss'],['the penalty pull','η · λ · w (ridge) or η · λ · sign(w) (lasso)','always toward 0']])}
<p>A weight settles where the two pulls balance. That one idea explains what regularization keeps and what it removes:</p>
${wt(['kind of weight','data pull','what happens'],[['a useful weight: shrinking it makes the misses much bigger','strong: pushes back hard','stays, a little smaller than without the penalty'],['a useless weight: it was only fitting noise','weak: the misses barely care','the penalty wins and it shrinks to about 0']])}
<p>So regularization does not shrink everything blindly. It removes what the data does not defend.</p>
${tryBox('c8t','A weight helps the model fit the true pattern. Under ridge, what happens to it?',mcHTML('c8t',['It goes to 0','It stays, somewhat smaller','It grows']))}`,
  init(S){wireMC(S,'c8t',1,'Shrinking it would raise the misses, so the data pull resists. It ends up a bit smaller, not gone.')}},
  tfScr('c8tf','Three statements about the two penalties','Judge each one.',['Ridge sets most weights to exactly 0.','Lasso can remove features from the model.','With no data pull at all, both penalties would move every weight toward 0.'],[1,0,0],'Ridge\'s pull fades as a weight shrinks, so weights get small but not 0. Lasso\'s pull is constant, so it carries weak weights all the way to 0, which removes those features. The penalty pull always points toward 0.'));}

${wt(['phase','needs labels?','changes the weights?','your version'],[['fit','yes','yes','your training loop, or fit_poly'],['predict','no','no','poly_predict']])}

 beforeWork('l10',{k:'The concept',h:'An error measured on few points is itself uncertain',
  html:()=>`<p>A validation error is a measurement, and like any measurement it has its own noise. The fewer points it is averaged over, the more it jumps around from one split to the next.</p><div class="fig"><div id="c10s"></div><div class="figcap">Illustrative: the same model scored on five different validation sets. Left group: 4 points each. Right group: 400 points each.</div></div>
${wt(['validation set size','the five scores','spread'],[['4 points','6.3, 2.2, 9.1, 3.0, 4.8','from 2.2 to 9.1'],['400 points','4.9, 5.1, 5.0, 4.8, 5.0','from 4.8 to 5.1']])}
<p>With 400 points a difference of 1.0 between two models means something. With 4 points it could be luck. Your 24 bills give validation sets of 4, which is why this lesson repeats the experiment over many splits before believing any winner.</p>
${tryBox('c10s','Two models score 5.2 and 4.6 on a validation set of 4 points. What can you conclude?',mcHTML('c10s',['The second model is better','Not much: the difference is within the luck of the split','The first model is better']))}`,
  init(S){const a=[6.3,2.2,9.1,3.0,4.8],b=[4.9,5.1,5.0,4.8,5.0];plot($('#c10s'),{h:240,x:{min:0.3,max:11.7,ticks:[[3,'4 points per set'],[9,'400 points per set']]},y:{min:0,max:10,ticks:[0,5,10]},ylab:'validation RMSE',aria:'Scores from small and large validation sets',series:[{type:'bars',data:a.map((v,i)=>[i+1,v]),color:'gold',labels:p=>p[1]},{type:'bars',data:b.map((v,i)=>[i+7,v]),color:'accent',labels:p=>p[1]}]});wireMC(S,'c10s',1,'With only 4 points the score itself swings by several units between splits, so a gap of 0.6 is not evidence.')}},
  {k:'The concept',h:'A model has to beat something simple',

${wt(['','what it predicts','RMSE on your bills'],[['the baseline (flat line)','the same kWh per day for every bill','10.08'],['degree 1, using temperature','a value that depends on temperature','9.98']])}
<p>The flat line predicts the average label of the training bills. In Python the average is one line, and <code>sum</code> is new here: <code>sum(a_list)</code> adds up every item in a list.</p><div class="codeline">flat = sum(y_train) / len(y_train)</div>
<p>The baseline ignores the feature. If a model that uses the feature is only slightly better, the feature explains very little, however sophisticated the model. That is a finding about the data, and no choice of degree or λ can fix it. What helps is a better feature or more data.</p>

function stepAnim(key,k,h,intro,steps,q){return {k,h,html:()=>`<p>${intro}</p><div class="fig"><div id="${key}p"></div><div class="movebox" id="${key}c" style="min-height:74px"></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-family:var(--sans)"><button id="${key}b">← Back</button><span id="${key}d" class="muted" style="font-size:14px"></span><button class="primary" id="${key}n">Next step →</button></div></div><div id="${key}q"></div>`,
 init(S){let i=Math.min(S.answers[key]||0,steps.length-1);const draw=()=>{steps[i].draw($('#'+key+'p'));$('#'+key+'c').innerHTML=`<b>Step ${i+1} of ${steps.length}.</b> ${steps[i].cap}`;$('#'+key+'d').textContent=`${i+1} / ${steps.length}`;$('#'+key+'b').style.visibility=i?'visible':'hidden';$('#'+key+'n').style.visibility=i<steps.length-1?'visible':'hidden';
   if(i===steps.length-1&&q&&!$('#'+key+'q').innerHTML){$('#'+key+'q').innerHTML=`<div class="q" style="margin-top:14px"><div class="qt">${q.q}</div>${q.o.map((o,j)=>`<label><input type="radio" name="${key}r" value="${j}"> ${o}</label>`).join('')}<div id="${key}f"></div></div>`;const show=v=>{$('#'+key+'f').innerHTML=fbHTML(v===q.a,q.whys[v])};const sv=S.answers[key+'q'];document.querySelectorAll(`input[name=${key}r]`).forEach(r=>{if(sv===+r.value)r.checked=true;r.onchange=()=>{S.answers[key+'q']=+r.value;save();show(+r.value)}});if(sv!==undefined)show(sv)}};
  $('#'+key+'b').onclick=()=>{i--;S.answers[key]=i;save();draw()};$('#'+key+'n').onclick=()=>{i++;S.answers[key]=i;save();draw()};draw()}}}

const c5score=(w,b,x)=>b+w[0]*x[0]+w[1]*x[1],c5pred=(w,b,x)=>c5score(w,b,x)>=0?1:0,r2=v=>(Math.round(v*100)/100).toString().replace('-','−');
function clipLine(w,b){const lo=-0.5,hi=3.7,P=[];if(Math.abs(w[1])>1e-9)[lo,hi].forEach(x=>{const y=-(w[0]*x+b)/w[1];if(y>=lo-1e-9&&y<=hi+1e-9)P.push([x,y])});if(Math.abs(w[0])>1e-9)[lo,hi].forEach(y=>{const x=-(w[1]*y+b)/w[0];if(x>=lo-1e-9&&x<=hi+1e-9)P.push([x,y])});P.sort((a,c)=>a[0]-c[0]||a[1]-c[1]);return P.length>=2?[P[0],P[P.length-1]]:[]}

 {k:'The data',h:'Eight alien sentences',

 {k:'The picture',h:'Each sentence is a point',

${tryBox('c51c','Where are the happy sentences in the plot?',mcHTML('c51c',['lower left','upper right','along the bottom']))}`,
  init(S){alienPlot($('#c51p'));wireMC(S,'c51c',1,'More words means further right and further up, and those sentences are happy.')}},
 {k:'In code',h:'A list of rows',

 {k:'The plan',h:'A line that separates the two groups',
  html:()=>`<p>A <b>classifier</b> is a model that predicts a label. The one in this chapter is a straight line: sentences on one side are predicted happy, sentences on the other side sad.</p>${fig('c51q','One line that puts all four happy sentences on one side and all four sad ones on the other.')}
<p>The <b>perceptron</b> is this kind of classifier, and the <b>perceptron algorithm</b> is how the line is found from the data. The rest of the chapter builds it in five small functions.</p>
<dl class="vocab"><dt>classification</dt><dd>Predicting a category.</dd><dt>label</dt><dd>The category to predict, here 1 (happy) or 0 (sad).</dd><dt>classifier</dt><dd>A model that predicts a label.</dd><dt>sentiment analysis</dt><dd>Predicting the mood of a piece of text.</dd></dl>

/* ---------- Lesson 2 ---------- */
SCREENS.c5l2=[
 {k:'Connecting back',h:'The score is a weighted sum you already wrote',
  html:()=>`${connectBox('Chapter 4 · Lesson 1 · poly_predict',`<p>poly_predict started at the bias and added weight × feature for every feature:</p>${codeBlock(hisCode('ch4-l1-pp',REF.pp||'def poly_predict(weights, bias, x):\n    features = poly_features(x, len(weights))\n    total = bias\n    for j in range(len(weights)):\n        total += weights[j] * features[j]\n    return total'))}`)}
<p>The perceptron does the same sum. Each word gets a weight, and the sentence gets a <b>score</b>:</p>
<div class="formula">score = w<sub>aack</sub> · x<sub>aack</sub> + w<sub>beep</sub> · x<sub>beep</sub> + b</div>
<p>Read it as: <b>each word's weight times how often it appears, added up, plus the bias.</b> With weights [1, 1] and bias −3.5, the sentence [1, 3] scores 1·1 + 1·3 − 3.5 = <b>0.5</b>.</p>
${tryBox('c52a','Weights [1, 1], bias −3.5. What is the score of the sentence [1, 2]?',numHTML('c52a'))}`,
  init(S){wireNum(S,'c52a',-0.5,0.001,'1·1 + 1·2 − 3.5 = −0.5.','Multiply each count by its weight, add them, then add the bias: 1 + 2 − 3.5.')}},
 {k:'From score to label',h:'The step function',
  html:()=>`<p>A score is a number, but the model must answer 0 or 1. The <b>step function</b> turns one into the other:</p>
<div class="formula">prediction = 1 if score ≥ 0, otherwise 0</div>${fig('c52s','The step function. Any score below 0 gives 0; a score of 0 or more gives 1.')}
<p>So a positive score means "happy", a negative score means "sad", and a score of exactly 0 counts as happy.</p>
${tryBox('c52b','A sentence has score −0.5. What is the prediction?',mcHTML('c52b',['0 (sad)','1 (happy)','−0.5']))}`,
  init(S){plot($('#c52s'),{w:560,h:220,x:{min:-3,max:3,ticks:[-3,-2,-1,0,1,2,3]},y:{min:-0.3,max:1.3,ticks:[0,1]},xlab:'score',ylab:'prediction',aria:'The step function',series:[{type:'line',data:[[-3,0],[0,0]],color:'gold',width:4},{type:'line',data:[[0,1],[3,1]],color:'accent',width:4},{type:'rings',data:[[0,0]],color:'gold',r:5},{type:'points',data:[[0,1]],color:'accent',r:6,opacity:1}]});wireMC(S,'c52b',0,'−0.5 is below 0, so the step function gives 0: sad.')}},
 workScr('Classify all eight sentences',`<p>Weights [1, 1], bias −3.5. For each sentence: compute the score, apply the step function, compare with the label.</p>${wt(['sentence [aack, beep]','score','prediction','label','correct?'],alienRows([1,1],-3.5,(x,l,s,p)=>[`[${x}]`,`${x[0]} + ${x[1]} − 3.5 = ${r2(s)}`,p,l,p===l?'yes':'no']))}<p>All eight are correct. A classifier is just these two numbers per row: a score, then a 0 or 1.</p>`,numTry('w52','Same weights and bias. What is the score of a new sentence [3, 3]?',2.5,0.001,'3 + 3 − 3.5 = 2.5. It is positive, so the prediction is 1: happy.')),
 {k:'New Python',h:'if, else and >=',
  html:()=>`<p>In the Lesson 4 lab you wrote an <code>if</code> with indented lines under it. <code>else</code> adds the other branch: what to do when the test is false.</p>
${codeBlock('if temperature >= 80:\n    print("hot")\nelse:\n    print("not hot")')}
${anat([{code:'if temperature >= 80:',does:'>= means "greater than or equal to". The test is true for 80, 81, 95; false for 79.',means:''},{code:'    print("hot")',does:'Runs only when the test is true.',means:''},{code:'else:',does:'Lined up with the if, ending in a colon. It has no test of its own.',means:''},{code:'    print("not hot")',does:'Runs only when the test is false. Exactly one of the two branches runs.',means:''}])}
<p>Inside a function, each branch can <code>return</code> its own answer. That is all the step function is.</p>
${tryBox('c52c','<code>temperature</code> is 80. What prints?',mcHTML('c52c',['hot','not hot','nothing']))}`,
  init(S){wireMC(S,'c52c',0,'80 >= 80 is true, because >= includes "equal to".')}},
 {k:'From idea to code',h:'score and prediction, line by line',
  html:()=>`<p>Two functions. <code>score</code> is the weighted sum; <code>prediction</code> calls score and applies the step function.</p>${anat(AN5.score)}${anat(AN5.pred)}
<dl class="vocab"><dt>score</dt><dd>Weights times features, added up, plus the bias.</dd><dt>step function</dt><dd>Turns a score into 1 (score ≥ 0) or 0.</dd><dt>prediction ŷ</dt><dd>The label the model outputs: the step function of the score.</dd><dt>perceptron</dt><dd>A classifier made of weights, a bias and the step function.</dd></dl>
<p class="figcap">Book: chapter 5, "Sentiment analysis classifier" and "The step function and activation functions".</p>`,init(S){}},
 quizScr('q52','Score and prediction','Four questions on this lesson\'s ideas.',[
  {q:'Weights [2, 1], bias −4, sentence [1, 1]. What is the score?',o:['−1','3','−4'],a:0,why:'2·1 + 1·1 − 4 = −1.'},
  {q:'That score is −1. What is the prediction?',o:['1','0','−1'],a:1,why:'The score is below 0, so the step function gives 0.'},
  {q:'A score is exactly 0. What is the prediction?',o:['0','1','Undefined'],a:1,why:'The rule is score ≥ 0 gives 1, and 0 ≥ 0 is true.'},
  {q:'How is score related to your poly_predict?',o:['It is the same weighted sum: bias plus weight × feature for each feature','It is unrelated','It squares the features first'],a:0,why:'Both start at the bias and add weights[j] * features[j] in a loop.'}])];

SCREENS.c5l3=[
 {k:'Connecting back',h:'Where the score is exactly 0',
  html:()=>`${connectBox('Lesson 2 · the step function','<p>The prediction flips from 0 to 1 at score = 0. So the points where the score is exactly 0 are the border between "sad" and "happy".</p>')}
<div class="formula">w<sub>aack</sub> · x<sub>aack</sub> + w<sub>beep</sub> · x<sub>beep</sub> + b = 0</div>
<p>Those points form a straight line, called the <b>boundary</b>. With weights [1, 1] and bias −3.5 it is the line x<sub>aack</sub> + x<sub>beep</sub> = 3.5.</p>${fig('c53a','On one side of the boundary every score is positive (the positive zone: predicted happy). On the other side every score is negative (the negative zone: predicted sad).')}
${tryBox('c53a','The sentence [3, 3] has score 2.5. Which zone is it in?',mcHTML('c53a',['the positive zone','the negative zone','on the boundary']))}`,
  init(S){alienPlot($('#c53a'),{w:[1,1],b:-3.5});wireMC(S,'c53a',0,'Its score is above 0, so it is in the positive zone and is predicted happy.')}},
 {k:'Try it',h:'Move the line yourself',
  html:()=>`<p>Change the two weights and the bias. Watch the boundary, and how many of the eight sentences it classifies correctly.</p>

${tryBox('c53b','Keep both weights at 1 and raise the bias from −3.5 toward 0. What happens?',mcHTML('c53b',['More sentences are predicted happy','More sentences are predicted sad','Nothing changes']))}`,
  init(S){const draw=()=>{const w=[+$('#c53w1').value,+$('#c53w2').value],b=+$('#c53b').value;['w1','w2','b'].forEach((k,i)=>$('#c53'+k+'v').textContent=r2([w[0],w[1],b][i]));alienPlot($('#c53p'),{w,b});const n=AX.filter((x,i)=>c5pred(w,b,x)===AY[i]).length;$('#c53o').innerHTML=`<b>${n} of 8</b> classified correctly. Boundary: ${r2(w[0])} · x<sub>aack</sub> + ${r2(w[1])} · x<sub>beep</sub> ${b<0?'−':'+'} ${r2(Math.abs(b))} = 0`};['w1','w2','b'].forEach(k=>$('#c53'+k).oninput=draw);draw();wireMC(S,'c53b',0,'A higher bias raises every score, so more points land at 0 or above. The boundary slides toward the lower left.')}},
 {k:'What they mean',h:'Weights and bias, in words',
  html:()=>`${wt(['part','what it says about the aliens','what it does to the line'],[['a positive weight','that word is a happy word: each use raises the score','—'],['a negative weight','that word is a sad word: each use lowers the score','—'],['a weight of 0','that word tells us nothing','—'],['a bigger weight for one word','that word matters more','tilts the line'],['the bias','the score of a sentence with no words at all','slides the line without tilting it']])}
<p>With bias −3.5 an empty sentence scores −3.5: these aliens are sad until enough words push the score to 0 or above.</p>

  {q:'What is true for every point on the boundary?',o:['Its score is 0','Its label is 0','Its features are 0'],a:0,why:'The boundary is where the score equals 0, the place where the prediction flips.'},
  {q:'Changing only the bias does what to the line?',o:['Tilts it','Slides it without tilting it','Nothing'],a:1,why:'The bias is added to every score equally, so the line moves but keeps its direction.'},

SCREENS.c5l4=[
 {k:'Connecting back',h:'How wrong is a classifier?',
  html:()=>`${connectBox('Chapter 3 · the error function','<p>For regression the error was the size of the miss: how far the prediction was from the label. Training made that number small.</p>')}
<p>A classifier's prediction is only 0 or 1, so "how far off" needs a new definition. The <b>perceptron error</b> of one point is:</p>
${wt(['the point is…','its error'],[['classified correctly','0'],['misclassified','|score|, the size of its score']])}
<p>Why the score? The size of a point's score grows with its distance from the boundary. A misclassified point just across the line has a small error; one deep in the wrong zone has a large error.</p>${fig('c54a','Weights [1, 1], bias −4.5. Two happy sentences, [1, 3] and [2, 2], are on the sad side of the boundary.')}`,
  init(S){alienPlot($('#c54a'),{w:BADW,b:BADB})}},
 workScr('The error of a not-so-good classifier',`<p>Weights [1, 1], bias −4.5. Score every sentence, then give each one its error.</p>${wt(['sentence','score','prediction','label','error'],alienRows(BADW,BADB,(x,l,s,p)=>[`[${x}]`,r2(s),p,l,p===l?'0':`<b>|${r2(s)}| = ${r2(Math.abs(s))}</b>`]).concat([['<b>total</b>','','','','<b>1.0</b>'],['<b>mean = total ÷ 8</b>','','','','<b>0.125</b>']]))}
<p>The <b>mean perceptron error</b> is the average over all points: 0.125 here. The good classifier from Lesson 2 (bias −3.5) got every point right, so its mean perceptron error is 0.</p>`,numTry('w54','A classifier misclassifies two of 8 points, with scores −2 and 0.4. What is its mean perceptron error?',0.3,0.0006,'The errors are 2 and 0.4, the total is 2.4, and 2.4 ÷ 8 = 0.3.')),
 {k:'Why not just count mistakes?',h:'The error must say which way is better',
  html:()=>`<p>Counting mistakes treats "barely wrong" and "badly wrong" the same. Training needs an error that gets a little smaller every time the line gets a little better.</p>
${wt(['classifier','mistakes','mean perceptron error'],[['A: two points just across the line (scores −0.1 and −0.1)','2','0.2 ÷ 8 = 0.025'],['B: two points deep in the wrong zone (scores −3 and −3)','2','6 ÷ 8 = 0.75']])}
<p>Both make two mistakes, but A is nearly right and B is far off. The mean perceptron error shows the difference.</p>
${real('Every training method you will meet needs an error that changes smoothly as the model improves. Chapter 6 replaces this error with a smoother one, called log loss, which is what neural networks use.')}
${tryBox('c54b','Which classifier needs the smaller change to become correct?',mcHTML('c54b',['A','B','they are the same']))}`,
  init(S){wireMC(S,'c54b',0,'A\'s misclassified points are almost on the boundary, which is what its small error says.')}},
 {k:'From idea to code',h:'error and mean_perceptron_error, line by line',
  html:()=>`<p><code>error</code> handles one point. <code>mean_perceptron_error</code> averages it over all points, with the same running-total loop as your rmse.</p>${anat(AN5.perr)}${anat(AN5.mpe)}
<p><b>== is not =.</b> One equals sign stores a value (<code>pred = 1</code>). Two equals signs ask a question: are these equal? (<code>pred == label</code>).</p>
<dl class="vocab"><dt>misclassified</dt><dd>The prediction is not the label.</dd><dt>perceptron error</dt><dd>0 for a correctly classified point; |score| for a misclassified one.</dd><dt>mean perceptron error</dt><dd>The average perceptron error over all points.</dd></dl>
<p class="figcap">Book: chapter 5, "How do we determine whether a classifier is good or bad? The error function".</p>`,init(S){}},

const NT55=numTry('w55','Same start (weights [1, 1], bias −4.5, η = 0.1), but the point is [2, 2] with label 1. What is the new weight for "aack"?',1.2,0.0006,'Score −0.5, prediction 0, label − prediction = 1. New weight: 1 + 0.1 · 1 · 2 = 1.2.');
SCREENS.c5l5=[
 {k:'Connecting back',h:'Nudge the line toward a point',
  html:()=>`${connectBox('Chapter 3 · the square trick','<p>The square trick took one point and moved the line a small step toward it. Repeating it trained the model.</p>')}
<p>The <b>perceptron trick</b> does the same for a classifier. It takes one point and asks: is this point classified correctly?</p>
${wt(['the point is…','what the trick does'],[['classified correctly','nothing: leave the line alone'],['misclassified','moves the line a small step toward the point, so the point ends up closer to its correct side']])}${fig('c55a','Weights [1, 1], bias −4.5. The circled happy sentence [1, 3] is on the sad side. The trick will move the line toward it.')}`,
  init(S){alienPlot($('#c55a'),{w:[1,1],b:-4.5,hi:[1,3]})}},
 {k:'The rule',h:'label − prediction decides the direction',
  html:()=>`<div class="formula" style="font-size:24px">new w = w + η · (label − prediction) · x</div><div class="formula" style="font-size:24px">new b = b + η · (label − prediction)</div>
<p>η is the learning rate, as in Chapter 3. The part in brackets has only three possible values:</p>
${wt(['label','prediction','label − prediction','effect'],[['1','1','0','nothing changes: the point was right'],['0','0','0','nothing changes: the point was right'],['1','0','+1','adds η · x to the weights and η to the bias: the score of this point goes <b>up</b>'],['0','1','−1','subtracts η · x and η: the score of this point goes <b>down</b>']])}
<p>So one formula covers every case. A happy point predicted sad needs a higher score, and it gets one. A sad point predicted happy needs a lower score, and it gets one.</p>
${tryBox('c55b','Label 0, prediction 1. What is label − prediction?',mcHTML('c55b',['+1','0','−1']))}`,
  init(S){wireMC(S,'c55b',2,'0 − 1 = −1, so the weights and bias go down and this point\'s score drops.')}},
 workScr('One step on one point',`<p>Weights [1, 1], bias −4.5, η = 0.1. The point is [1, 3] with label 1.</p>${wt(['step','work','result'],[['1 · score','1·1 + 1·3 − 4.5','−0.5'],['2 · prediction','−0.5 is below 0','0'],['3 · label − prediction','1 − 0','+1'],['4 · new weight for "aack"','1 + 0.1 · 1 · 1','1.1'],['5 · new weight for "beep"','1 + 0.1 · 1 · 3','1.3'],['6 · new bias','−4.5 + 0.1 · 1','−4.4'],['7 · new score of this point','1.1·1 + 1.3·3 − 4.4','<b>0.6</b>']])}<p>The score went from −0.5 to 0.6, so the point is now classified correctly.</p>${fig('c55w','Dashed: the line before. Solid: the line after one step. It moved toward the circled point and passed it.')}`,{html:NT55.html,init(S){alienPlot($('#c55w'),{old:{w:[1,1],b:-4.5},w:[1.1,1.3],b:-4.4,hi:[1,3],lineLabel:'line after'});NT55.init(S)}}),
 {k:'From idea to code',h:'perceptron_trick, line by line',
  html:()=>`${connectBox('Chapter 4 · Lesson 2 · your poly_square_trick',`<p>Same shape: work out how wrong the point is, build new_weights in a loop, update the bias, return both.</p>${codeBlock(hisCode('ch4-l2-pst',L2PST.replace(/\n    # [^\n]*/g,'')))}`)}
<p>The only change: <code>miss</code> is replaced by <code>(label - pred)</code>, which is −1, 0 or +1.</p>${anat(AN5.ptrick)}
<p class="figcap">Book: chapter 5, "The perceptron trick: A way to slightly improve the perceptron".</p>`,init(S){}},
 quizScr('q55','The perceptron trick','Four questions on this lesson\'s ideas.',[

'ch5-l2-score':{task:'A classifier with no bias can only draw lines through the corner where both counts are 0. Change <b>score</b> so it ignores the bias: the total starts at 0.',q:{q:'With weights [1, 1], what will the changed score([1, 1], -3.5, [1, 3]) return?',o:['0.5','4','−3.5'],a:1,why:'Without the bias it is just 1·1 + 1·3 = 4.'},solution:'def score(weights, bias, features):\n    total = 0\n    for j in range(len(weights)):\n        total += weights[j] * features[j]\n    return total',calls:['print(score([1, 1], -3.5, [1, 3]))','print(score([2, -1], 10, [3, 2]))'],done:'The bias no longer counts. Every score is now just weights times features.'},
'ch5-l2-pred':{task:'Make the classifier stricter. Change <b>prediction</b> so a sentence needs a score of <b>at least 1</b> to be predicted happy.',q:{q:'Weights [1, 1], bias −3.5. The eight scores are −2.5, −1.5, −1.5, −0.5, 0.5, 0.5, 1.5, 1.5. After the change, how many sentences are predicted happy?',o:['2','4','6'],a:0,why:'Only the two scores of 1.5 reach 1. The two sentences with score 0.5 are now predicted sad.'},solution:'def prediction(weights, bias, features):\n    if score(weights, bias, features) >= 1:\n        return 1\n    else:\n        return 0',calls:['print(prediction([1, 1], -3.5, [1, 3]))','print(prediction([1, 1], -3.5, [2, 3]))','print(prediction([1, 1], -3, [2, 2]))'],done:'The boundary moved: the same line, shifted so fewer points count as happy.'},
'ch5-l4-error':{task:'Change <b>error</b> so every misclassified point costs exactly <b>1</b>, whatever its score. This version just counts mistakes.',q:{q:'With the change, what does a misclassified point with score −3 cost?',o:['3','1','0'],a:1,why:'Every mistake now costs 1, so the error no longer says how far off the point is.'},solution:'def error(weights, bias, features, label):\n    pred = prediction(weights, bias, features)\n    if pred == label:\n        return 0\n    else:\n        return 1',calls:['print(error([1, 1], -4.5, [1, 3], 1))','print(error([1, 1], -4.5, [3, 2], 1))','print(error([1, 1], -8, [1, 0], 1))'],done:'This is "count the mistakes". It cannot tell a near miss from a bad miss, which is why the lesson uses the size of the score.'},
'ch5-l4-mpe':{task:'Change <b>mean_perceptron_error</b> so it returns the <b>total</b> error, not the mean.',q:{q:'For weights [1, 1], bias −4.5 on the alien data the mean was 0.125 over 8 points. What will the total be?',o:['0.125','1.0','8'],a:1,why:'0.125 × 8 = 1.0: the two misclassified points cost 0.5 each.'},solution:'def mean_perceptron_error(weights, bias, features, labels):\n    total = 0\n    for i in range(len(features)):\n        total += error(weights, bias, features[i], labels[i])\n    return total',calls:['print(mean_perceptron_error([1, 1], -4.5, ALIEN_X, ALIEN_Y))','print(mean_perceptron_error([1, 1], -3.5, ALIEN_X, ALIEN_Y))'],done:'A total grows with the size of the dataset; a mean does not, so means can be compared between datasets.'},
'ch5-l5-trick':{task:'Change <b>perceptron_trick</b> so it updates the weights but leaves the <b>bias unchanged</b>. The line can then tilt but not slide.',q:{q:'Weights [1, 1], bias −4.5, point [1, 3], label 1, eta 0.1. After the change, what bias comes back?',o:['−4.4','−4.5','−4.6'],a:1,why:'The bias line is gone, so the bias that went in comes back out.'},solution:'def perceptron_trick(weights, bias, features, label, eta):\n    pred = prediction(weights, bias, features)\n    new_weights = []\n    for j in range(len(weights)):\n        new_weights.append(weights[j] + eta * (label - pred) * features[j])\n    return new_weights, bias',calls:['print(perceptron_trick([1, 1], -4.5, [1, 3], 1, 0.1))','print(perceptron_trick([1, 1], -2.5, [1, 2], 0, 0.1))'],done:'Only the weights move now. Each line of the trick controls one part of how the boundary can move.'},
'ch5-l6-alg':{task:'Change <b>perceptron_algorithm</b> so every weight starts at <b>0.0</b> instead of 1.0.',q:{q:'With every weight 0.0 and bias 0.0, every score starts at 0. What is the very first recorded error?',o:['0','1.5','8'],a:0,why:'Score 0 gives prediction 1. The four sad points are misclassified, but each costs |0| = 0, so the first error is 0 even though half the points are wrong.'},solution:'def perceptron_algorithm(features, labels, eta, epochs):\n    weights = []\n    for j in range(len(features[0])):\n        weights.append(0.0)\n    bias = 0.0\n    errors = []\n    for epoch in range(epochs):\n        errors.append(mean_perceptron_error(weights, bias, features, labels))\n        i = random.randint(0, len(features) - 1)\n        weights, bias = perceptron_trick(weights, bias, features[i], labels[i], eta)\n    return weights, bias, errors',calls:['random.seed(3); _r = perceptron_algorithm(ALIEN_X, ALIEN_Y, 0.1, 20); print(_r[2][0])','print([round(v, 4) for v in _r[0]])','print(round(_r[1], 4))'],done:'A different starting line, the same algorithm. The first error of 0 is a weakness of this error function that Chapter 6 fixes.'}};

 for(let j=0;j<sk;j++){const e=inp(j);e.oninput=()=>{P.vals[j]=e.value;clearBad();save()};e.onkeydown=ev=>{if(ev.key==='Tab'&&!ev.shiftKey&&e.value.trim()&&e.value.slice(0,e.selectionStart).trim()){if(j<sk-1){ev.preventDefault();inp(j+1).focus()}}else if(ev.key==='Tab'&&!ev.shiftKey){ev.preventDefault();const a=e.selectionStart;e.setRangeText('    ',a,e.selectionEnd,'end');P.vals[j]=e.value;save()}else if(ev.key==='Enter'){ev.preventDefault();if(j<sk-1)inp(j+1).focus();else $('#run').click()}}}
 const nextBtn=()=>{$('#nx').innerHTML=`<div class="nextnav"><button class="primary" id="nxt">Next: ${k<L.parts.length-1?esc(L.parts[k+1].short):'Results'} →</button></div>`;$('#nxt').onclick=()=>go(k+2)};if(P.passed)nextBtn();
 const drawHints=()=>{const H=p.hints;let h=H.slice(0,P.hints).map((x,j)=>`<div class="fb info" style="margin:0 0 8px"><b>Hint ${j+1}.</b> ${esc(x)}</div>`).join('');$('#hints').innerHTML=h;$('#hint').textContent=P.hints>=H.length?'Hints used':'Get hint '+(P.hints+1)};drawHints();
 $('#hint').onclick=()=>{if(P.hints<p.hints.length){P.hints++;save()}drawHints();{const db=document.querySelector('.dbody');if(db)db.scrollTop=0}};
 $('#run').onclick=async()=>{clearBad();if(![...Array(sk).keys()].some(j=>(inp(j).value||'').trim())){$('#out').innerHTML=`<div class="fb no">Write ${lab} first.</div>`;inp(0).focus();return}
  $('#out').innerHTML=`<div class="fb info">${/sklearn/.test(pre)&&!window.skReady?'Loading scikit-learn. This happens once per visit and can take up to a minute (about 85 MB)…':'Running…'}</div>`;await new Promise(r=>setTimeout(r,30));P.runs=(P.runs||0)+1;const r=await runLab(pre,asm(),p.expect,p.post);
  if(!r){$('#out').innerHTML='<div class="fb bad">Python could not load here.</div>';return}
  lastOut=(r.out||'')+'\n'+r.msg;if(r.ok){P.passed=true;P.out=r.out;P.chart=r.chart}save();
  let dg=!r.ok&&(p.diag||[]).find(d=>(r.out||'').includes(d[0]));const typed=[...Array(sk).keys()].map(j=>inp(j).value).join(' ');
  if(!r.ok&&!dg&&/IndexError/.test(r.msg)&&/weights\[i\]/.test(typed))dg=[0,'weights[i] picks one item, but weights has only a few items and i goes up to 39. Pass the whole list: weights.'];
  const nm=(r.msg.match(/name '(\w+)' is not defined/)||[])[1];if(!r.ok&&!dg&&nm&&r.err>s0+sk&&!new RegExp('\\b'+nm+'\\b').test(typed))dg=[0,`Line ${r.err} uses ${nm}, which your line is supposed to create. Start your line with: ${nm} =`];
  if(!r.ok&&!dg&&/NameError/.test(r.msg)&&/[(,]\s*(x|label|eta|xs|ys)\s*[,)]/.test(typed))dg=[0,'x, label, eta, xs and ys are slot names inside the function. Out here, pass real values from this code, as listed under Look up, Slots.'];
  $('#out').innerHTML=(r.out?`<pre class="stdout">${esc(r.out)}</pre>`:'')+(dg?`<div class="fb info" style="margin-bottom:8px"><b>Likely cause.</b> ${esc(dg[1])}</div>`:'')+resultHTML(r,k<L.parts.length-1?'Go on to the next part.':'Go on to the Results page for the chart.');
  if(r.err){const row=document.querySelector(`.lr[data-l="${r.err}"]`);if(row)row.classList.add('bad')}
  if(r.ok){nextBtn();document.querySelectorAll('.wsteps button')[k+2].classList.add('done')}}}
function labResults(id,A,S,L,shell,why,tut){shell('Results','Compare the results with your prediction, then answer the reflection question to finish.',[why,tut],{steps:['Read the results and chart','Answer the reflection question','Press Finish this lab'],done:'you have answered the reflection question',about:'<b>Results.</b> Compare what happened with what you predicted, then say why in your own words.'});const ok=S.lp===A.predict.ans;
 $('#stage').innerHTML=`<div class="wcard wed"><div class="wedin"><div class="fb ${ok?'ok':'no'}" style="margin-top:0"><b>Your prediction: ${esc(A.predict.opts[S.lp])}. ${ok?'Correct.':'Not what happened.'}</b> ${A.predict.why}</div>
${L.parts.map((p,k)=>`<h3 style="font-family:var(--sans);font-size:16px;margin:16px 0 6px">${esc(p.name)}</h3><pre class="stdout">${esc((S.parts[k]||{}).out||'')}</pre><div class="fig" id="rfig${k}" ${(S.parts[k]||{}).chart?'':'hidden'}></div>`).join('')}
<div class="finish"><h3>Reflect</h3><p style="margin:6px 0 10px">${esc(A.reflect.q)}</p><textarea id="tb" rows="3" placeholder="In your own words" aria-label="Your reflection">${esc(S.teach||'')}</textarea><div class="err" id="tbe"></div>
<div class="actions"><button id="fbk" ${sample?'':'hidden'}>Get feedback on my reflection</button></div><div id="fbo">${S.feedback?`<div class="answer">${esc(S.feedback)}</div>`:''}</div></div></div></div>`;
 dock('<div class="dockbar"><span class="sp"></span><button class="primary" id="done">Finish this lab</button></div>');L.parts.forEach((p,k)=>{const c=(S.parts[k]||{}).chart;if(c)labChart($('#rfig'+k),c)});lastOut=L.parts.map((p,k)=>(S.parts[k]||{}).out||'').join('\n');
 $('#tb').oninput=()=>{S.teach=$('#tb').value;$('#tbe').textContent='';save()};
 $('#fbk').onclick=async()=>{const t=$('#tb').value.trim();if(!t){$('#tbe').textContent='Write your reflection first.';return}if(!sample)return;$('#fbo').innerHTML='<div class="answer">Thinking…</div>';
  try{const r=await sample(`You are a precise, encouraging tutor for an adult beginner learning machine learning and Python from the book Grokking Machine Learning, chapter ${A.ch}.\nLab: ${A.name}. His lab output:\n${lastOut||'(none)'}\nQuestion he answered: ${A.reflect.q}\nThe key idea a strong answer contains: ${A.reflect.key}\nHis answer: ${t}\nReply in at most 100 words, plain text, no headings. Start with one word: "Correct", "Partly" or "Not yet". Then say what is right, then fix any gap using the numbers from his lab. Use exact vocabulary (training set, validation set, testing set, overfitting, underfitting, weight, bias, regularization, λ).`,{modelTier:'default',onText:({text})=>{$('#fbo').innerHTML=`<div class="answer">${esc(text)}</div>`}});
   S.feedback=r.text;save();$('#fbo').innerHTML=`<div class="answer">${esc(r.text)}</div>`}catch(e){$('#fbo').innerHTML=`<div class="answer">The tutor is unavailable right now${e&&e.code==='rate_limited'?' (too many requests; wait a minute)':''}.</div>`}};
 $('#done').onclick=()=>{if(!$('#tb').value.trim()){$('#tbe').textContent='Write your reflection first.';return}S.done=true;S.doneAt=new Date().toISOString();if(typeof revCredit==='function')revCredit(A);save();const to=afterAct(A);if(location.hash===to)route();else location.hash=to}}

/* ---------- lab charts ---------- */
function labChart(el,ch){const cap=t=>`<div class="figcap">${t}</div>`;
 if(ch.kind==='trained'){knobPlot(el,ch.w,ch.b,[{type:'line',data:DATA.grid.map(x=>[x,2-x*x]),color:'gold',dash:true,width:2}]);el.insertAdjacentHTML('beforeend','<div class="legend"><span><i style="background:#1f5c57"></i>your trained model</span><span><i style="background:#c08a1e"></i>the curve the data was made from: 2 − x²</span></div>'+cap('After 5,000 steps from a flat start, your weights and bias give a curve almost on top of the true one.'));return}
 if(ch.kind==='hillfits'){const cols={1:'gold',2:'accent',10:'red'};plot(el,{...hillAxes,legend:true,aria:'Degree 1, 2 and 10 fits',series:[{type:'points',data:pts(DATA.X,DATA.Y),color:'ink',opacity:.55},...ch.degrees.map(d=>({type:'line',data:DATA.grid.map((x,i)=>[x,ch.curves[String(d)][i]]),color:cols[d],label:'degree '+d,width:d===2?3.5:2.5}))]});el.insertAdjacentHTML('beforeend',cap('Your three models on the 40 hill points. Degree 10 wiggles to get closer to every point.'))}
 else if(ch.kind==='traintest'){const r=ch.rows;plot(el,{x:{min:0.4,max:3.6,ticks:r.map((v,i)=>[i+1,'degree '+v[0]])},y:{min:0,max:0.6,ticks:[0,0.2,0.4,0.6]},legend:true,ylab:'RMSE',aria:'Training vs testing error',series:[{type:'bars',bw:0.32,off:-0.17,data:r.map((v,i)=>[i+1,v[1]]),color:'accent',label:'training',labels:p=>p[1].toFixed(3)},{type:'bars',bw:0.32,off:0.17,data:r.map((v,i)=>[i+1,v[2]]),color:'gold',label:'testing',labels:p=>p[1].toFixed(3)}]});el.insertAdjacentHTML('beforeend',cap('The gap between the bars grows with the degree. A big gap is overfitting.'))}
 else if(ch.kind==='valcurve'){const r=ch.rows;plot(el,{x:{min:0.5,max:10.5,ticks:r.map(v=>v[0])},y:{min:0.1,max:5,log:true,ticks:[0.1,0.3,1,3]},xlab:'degree',ylab:'validation RMSE (log scale)',aria:'Validation error by degree',series:[{type:'line',data:r,color:'gold',dots:true}],marks:[{x:ch.best,label:'chosen: degree '+ch.best,color:'accent'}]});el.insertAdjacentHTML('beforeend',cap('The vertical axis is on a log scale so degree 10 (4.775) fits on the chart.'))}
 else if(ch.kind==='lamscores'){const r=ch.rows;plot(el,{x:{min:-0.4,max:3.4,ticks:r.map((v,i)=>[i,'λ = '+v[0]])},y:{min:0.05,max:400,log:true,ticks:[0.1,1,10,100]},legend:true,ylab:'lasso score (log scale)',aria:'Lasso scores by lambda',series:[{type:'line',data:r.map((v,i)=>[i,v[1]]),color:'accent',dots:true,label:'degree 2'},{type:'line',data:r.map((v,i)=>[i,v[2]]),color:'red',dots:true,label:'degree 10'}]});el.insertAdjacentHTML('beforeend',cap('Lower score wins. Degree 10 wins only at λ = 0.'))}
 else if(ch.kind==='weightbars'){el.innerHTML=`<div class="three">${ch.runs.map((r,i)=>`<div><b style="font-family:var(--sans);font-size:14px">λ = ${r[0]}</b><div id="wb${i}"></div></div>`).join('')}</div>`;ch.runs.forEach((r,i)=>plot($('#wb'+i),{w:300,h:200,padL:36,x:{min:0.3,max:6.7,ticks:r[1].map((_,j)=>[j+1,'w'+(j+1)])},y:{min:-1,max:1,ticks:[-1,0,1],base:0},aria:'weights at lambda '+r[0],series:[{type:'bars',data:r[1].map((v,j)=>[j+1,v]),color:'accent'}]}));el.insertAdjacentHTML('beforeend',cap('The six weights after training. As λ grows, every weight is pulled toward 0.'))}
 else if(ch.kind==='coefbars'){el.innerHTML=`<div class="twocol"><div><b style="font-family:var(--sans);font-size:14px">Ridge</b><div id="cr"></div></div><div><b style="font-family:var(--sans);font-size:14px">Lasso</b><div id="cl2"></div></div></div>`;const sp=w=>({w:320,h:200,padL:36,x:{min:0.3,max:10.7,ticks:w.map((_,j)=>[j+1,''+(j+1)])},y:{min:-1.2,max:1.2,ticks:[-1,0,1],base:0},aria:'coefficients',series:[{type:'bars',data:w.map((v,j)=>[j+1,Math.max(-1.2,Math.min(1.2,v))]),color:'accent'}]});plot($('#cr'),sp(ch.ridge));plot($('#cl2'),sp(ch.lasso));el.insertAdjacentHTML('beforeend',cap('coef_ for each model (w₁…w₁₀). Lasso keeps only two weights; the rest are exactly 0.'))}
 else if(ch.kind==='wins'){const keys=['flat','1','2','3','4','5','6'],w=ch.wins;plot(el,{x:{min:-0.6,max:6.6,ticks:keys.map((k,i)=>[i,k==='flat'?'flat':'deg '+k])},y:{min:0,max:40,ticks:[0,10,20,30,40]},aria:'Wins by model',series:[{type:'bars',data:keys.map((k,i)=>[i,w[k]||0]),color:'accent',labels:p=>p[1]}]});el.insertAdjacentHTML('beforeend',cap('How often each model had the lowest validation error, over 100 random splits.'))}}

refs();
route();
